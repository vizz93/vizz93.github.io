			<script>
			(function () {
				var burger = document.getElementById('header-burger');
				var navWrap = document.getElementById('site-nav-wrap');
				if (!burger || !navWrap) { return; }

				function closeMenu() {
					burger.classList.remove('is-open');
					navWrap.classList.remove('is-open');
					burger.setAttribute('aria-expanded', 'false');
				}

				burger.addEventListener('click', function (e) {
					e.preventDefault();
					e.stopPropagation();
					var isOpen = burger.classList.toggle('is-open');
					if (isOpen) {
						navWrap.classList.add('is-open');
					} else {
						navWrap.classList.remove('is-open');
					}
					burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
				});

				var links = navWrap.querySelectorAll('a');
				for (var i = 0; i < links.length; i++) {
					links[i].addEventListener('click', closeMenu);
				}

				document.addEventListener('click', function (e) {
					if (!burger.contains(e.target) && !navWrap.contains(e.target)) {
						closeMenu();
					}
				});
			})();
			</script>
